<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>后台登录</title>
  <style>
    body { font-family:"Microsoft YaHei UI",sans-serif; background:#f4efe6; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .box { background:#fff; padding:24px; border-radius:8px; width:320px; border:1px solid #ddd; }
    input { width:100%; padding:8px; margin:8px 0; }
    button { width:100%; padding:10px; background:#8b5a2b; color:#fff; border:0; cursor:pointer; }
    .err { color:#b00020; font-size:13px; }
  </style>
</head>
<body>
  <div class="box">
    <h3>授权后台登录</h3>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post">
      <input name="username" placeholder="管理员账号" value="admin" />
      <input name="password" type="password" placeholder="密码" />
      <button type="submit">登录</button>
    </form>
    <p style="font-size:12px;color:#888">默认 admin / admin123，登录后请尽快修改。</p>
  </div>
</body>
</html>
